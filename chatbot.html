<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechWorld Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; }

        .chat-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4a90d9, #357abd);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(74,144,217,0.4);
            z-index: 1000;
            transition: transform 0.3s;
        }
        .chat-btn:hover { transform: scale(1.1); }
        .chat-btn svg { width: 28px; height: 28px; fill: #fff; }

        .chat-window {
            position: fixed;
            bottom: 100px;
            right: 25px;
            width: 370px;
            height: 500px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            display: none;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
        }
        .chat-window.active { display: flex; }

        .chat-header {
            background: linear-gradient(135deg, #4a90d9, #357abd);
            color: #fff;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .avatar {
            width: 38px;
            height: 38px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .chat-header-info h3 { font-size: 15px; }
        .chat-header-info p { font-size: 12px; opacity: 0.85; }
        .chat-close {
            margin-left: auto;
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
        }
        .message.bot {
            align-self: flex-start;
            background: #f0f2f5;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        .message.user {
            align-self: flex-end;
            background: #4a90d9;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .typing {
            align-self: flex-start;
            background: #f0f2f5;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            color: #999;
        }

        .chat-input {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e0e0e0;
            gap: 8px;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }
        .chat-input input:focus { border-color: #4a90d9; }
        .chat-input button {
            width: 38px;
            height: 38px;
            background: #4a90d9;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-input button svg { width: 18px; height: 18px; fill: #fff; }

        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 15px 10px;
        }
        .quick-replies button {
            padding: 6px 12px;
            border: 1px solid #4a90d9;
            background: #fff;
            color: #4a90d9;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .quick-replies button:hover {
            background: #4a90d9;
            color: #fff;
        }

        @media (max-width: 420px) {
            .chat-window { width: calc(100% - 20px); right: 10px; bottom: 90px; height: 60vh; }
        }
    </style>
</head>
<body>

<!-- Chat Toggle Button -->
<div class="chat-btn" onclick="toggleChat()">
    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
</div>

<!-- Chat Window -->
<div class="chat-window" id="chatWindow">
    <div class="chat-header">
        <div class="avatar">🤖</div>
        <div class="chat-header-info">
            <h3>TechWorld Assistant</h3>
            <p>Online • Typically replies instantly</p>
        </div>
        <button class="chat-close" onclick="toggleChat()">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="quick-replies" id="quickReplies"></div>
    <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<script>
const responses = {
    "hello": "Hi there! 👋 Welcome to TechWorld. How can I help you today?",
    "hi": "Hey! 👋 How can I assist you today?",
    "hey": "Hello! What can I help you with?",
    "products": "We sell a range of tech products including laptops, phones, headphones, and accessories. Check out our <a href='products.html'>Products page</a>!",
    "shipping": "We offer free shipping on orders over $50. Standard delivery takes 3-5 business days.",
    "delivery": "Standard delivery is 3-5 business days. Express shipping (1-2 days) is available for $9.99.",
    "return": "We have a 30-day return policy. Items must be unused and in original packaging. Visit our store or contact support.",
    "refund": "Refunds are processed within 5-7 business days after we receive the returned item.",
    "payment": "We accept Visa, MasterCard, PayPal, and Apple Pay. All transactions are secured with SSL encryption.",
    "contact": "You can reach us at support@techworld.com or call us at (555) 123-4567. We're available Mon-Fri, 9am-6pm.",
    "hours": "Our support team is available Monday to Friday, 9:00 AM - 6:00 PM (EST).",
    "cart": "You can view your cart by clicking <a href='cart.html'>here</a>. Add items from the Products page!",
    "discount": "Sign up for our newsletter to get 10% off your first order! We also run seasonal sales.",
    "warranty": "All our products come with a 1-year manufacturer warranty. Extended warranties are available at checkout.",
    "track": "To track your order, check your email for the tracking link sent after purchase, or contact our support team.",
    "thanks": "You're welcome! 😊 Is there anything else I can help you with?",
    "thank you": "Happy to help! Let me know if you need anything else.",
    "bye": "Goodbye! Thanks for visiting TechWorld. Have a great day! 👋",
};

const quickReplyOptions = ["Products", "Shipping", "Returns", "Contact", "Payment"];

function toggleChat() {
    const win = document.getElementById('chatWindow');
    win.classList.toggle('active');
    if (win.classList.contains('active') && document.getElementById('chatMessages').children.length === 0) {
        addBotMessage("Hi! 👋 I'm the TechWorld assistant. How can I help you today?");
        showQuickReplies();
    }
}

function showQuickReplies() {
    const container = document.getElementById('quickReplies');
    container.innerHTML = quickReplyOptions.map(q => 
        `<button onclick="quickReply('${q}')">${q}</button>`
    ).join('');
}

function quickReply(text) {
    document.getElementById('quickReplies').innerHTML = '';
    addUserMessage(text);
    setTimeout(() => getBotResponse(text), 600);
}

function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    document.getElementById('quickReplies').innerHTML = '';
    addUserMessage(text);
    showTyping();
    setTimeout(() => {
        removeTyping();
        getBotResponse(text);
    }, 800 + Math.random() * 500);
}

function addUserMessage(text) {
    const div = document.createElement('div');
    div.className = 'message user';
    div.textContent = text;
    document.getElementById('chatMessages').appendChild(div);
    scrollToBottom();
}

function addBotMessage(html) {
    const div = document.createElement('div');
    div.className = 'message bot';
    div.innerHTML = html;
    document.getElementById('chatMessages').appendChild(div);
    scrollToBottom();
}

function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.textContent = 'Typing...';
    document.getElementById('chatMessages').appendChild(div);
    scrollToBottom();
}

function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
}

function getBotResponse(input) {
    const lower = input.toLowerCase();
    let reply = null;

    for (const [key, value] of Object.entries(responses)) {
        if (lower.includes(key)) {
            reply = value;
            break;
        }
    }

    if (!reply) {
        reply = "I'm not sure about that, but I'd be happy to help! You can ask me about our products, shipping, returns, payments, or contact info. Or reach our team at support@techworld.com.";
    }

    addBotMessage(reply);
    setTimeout(showQuickReplies, 300);
}

function scrollToBottom() {
    const msgs = document.getElementById('chatMessages');
    msgs.scrollTop = msgs.scrollHeight;
}
</script>

</body>
</html>
