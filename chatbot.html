<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechWorld Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #chatbox {
            width: 380px;
            height: 520px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #chatbox-header {
            background: #4a90d9;
            color: white;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
        }
        #chatbox-header span {
            font-size: 12px;
            font-weight: normal;
            opacity: 0.8;
            display: block;
            margin-top: 3px;
        }
        #messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }
        .msg {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 75%;
            font-size: 14px;
            line-height: 1.4;
            clear: both;
        }
        .bot-msg {
            background: #f1f1f1;
            color: #333;
            float: left;
        }
        .user-msg {
            background: #4a90d9;
            color: white;
            float: right;
        }
        .clearfix { clear: both; }
        #input-area {
            display: flex;
            border-top: 1px solid #ddd;
            padding: 10px;
        }
        #user-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }
        #send-btn {
            margin-left: 8px;
            padding: 10px 18px;
            background: #4a90d9;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
        #send-btn:hover { background: #357abd; }
        #suggestions {
            padding: 8px 15px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .sug-btn {
            padding: 5px 12px;
            background: white;
            border: 1px solid #4a90d9;
            color: #4a90d9;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .sug-btn:hover { background: #4a90d9; color: white; }
    </style>
</head>
<body>
    <div id="chatbox">
        <div id="chatbox-header">
            🤖 TechWorld Assistant
            <span>Ask me anything about our store</span>
        </div>
        <div id="messages"></div>
        <div id="suggestions">
            <button class="sug-btn" onclick="ask('Products')">Products</button>
            <button class="sug-btn" onclick="ask('Shipping')">Shipping</button>
            <button class="sug-btn" onclick="ask('Returns')">Returns</button>
            <button class="sug-btn" onclick="ask('Contact')">Contact</button>
            <button class="sug-btn" onclick="ask('Payment')">Payment</button>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type your question...">
            <button id="send-btn" onclick="send()">Send</button>
        </div>
    </div>

    <script>
        function getResponse(text) {
            var t = text.toLowerCase();
            if (t.match(/hi|hello|hey|hola/)) return "Hi there! 👋 Welcome to TechWorld. How can I help you?";
            if (t.match(/product|shop|buy|sell|item|laptop|phone/)) return "We sell laptops, phones, headphones & accessories. Visit our Products page to browse!";
            if (t.match(/ship|deliver/)) return "Free shipping on orders over $50! Standard: 3-5 days. Express: 1-2 days for $9.99.";
            if (t.match(/return|refund|exchange/)) return "30-day return policy. Items must be unused & in original packaging. Refunds in 5-7 days.";
            if (t.match(/pay|card|visa|paypal/)) return "We accept Visa, MasterCard, PayPal & Apple Pay. All transactions are SSL secured.";
            if (t.match(/contact|email|phone|call|support/)) return "Email: support@techworld.com | Phone: (555) 123-4567 | Mon-Fri 9am-6pm EST.";
            if (t.match(/cart|basket|order/)) return "Check your cart on the Cart page. Add items from the Products page!";
            if (t.match(/discount|coupon|sale|deal/)) return "Sign up for our newsletter for 10% off your first order! Seasonal sales available.";
            if (t.match(/warranty|guarantee/)) return "All products include 1-year warranty. Extended warranties available at checkout.";
            if (t.match(/track|status|where/)) return "Check your email for the tracking link, or contact support for help.";
            if (t.match(/price|cost|how much|expensive/)) return "Prices vary by product. Check our Products page for current pricing!";
            if (t.match(/signup|sign up|register|account/)) return "Create an account on our Sign Up page - takes just a minute!";
            if (t.match(/feedback|review/)) return "We'd love your feedback! Visit our Feedback page.";
            if (t.match(/about|team|who/)) return "Learn about our team on the About Us page!";
            if (t.match(/thank|thx/)) return "You're welcome! 😊 Anything else I can help with?";
            if (t.match(/bye|goodbye/)) return "Goodbye! Have a great day! 👋";
            return "I'm not sure about that. Try asking about: products, shipping, returns, payments, or contact info!";
        }

        function addMsg(text, isUser) {
            var div = document.createElement("div");
            div.className = "msg " + (isUser ? "user-msg" : "bot-msg");
            div.textContent = text;
            var clear = document.createElement("div");
            clear.className = "clearfix";
            var msgs = document.getElementById("messages");
            msgs.appendChild(div);
            msgs.appendChild(clear);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function send() {
            var input = document.getElementById("user-input");
            var text = input.value.trim();
            if (text === "") return;
            input.value = "";
            addMsg(text, true);
            setTimeout(function() {
                addMsg(getResponse(text), false);
            }, 500);
        }

        function ask(text) {
            addMsg(text, true);
            setTimeout(function() {
                addMsg(getResponse(text), false);
            }, 500);
        }

        document.getElementById("user-input").addEventListener("keydown", function(e) {
            if (e.key === "Enter") send();
        });

        // Welcome message
        addMsg("Hi! I'm the TechWorld assistant. Ask me about products, shipping, returns, or anything else!", false);
    </script>
</body>
</html>
