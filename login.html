<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Login - LuxAccessories"><title>Login - LuxAccessories</title><link rel="stylesheet" href="style.css"></head><body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<div class="site-wrapper">
  <header class="site-header"><div class="header-top"><a class="logo" href="index.html">LuxAccessories</a><input class="search-bar" type="search" placeholder="Search..."></div><nav class="site-nav"><ul><li><a href="index.html">Home</a></li><li><a href="accessories.html">Accessories</a></li><li><a href="offers.html">Offers</a></li><li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li><li><a href="feedback.html">Feedback</a></li></ul></nav></header>

  <main id="main-content" class="main-content">
    <article>
      <div class="form-page">
        <h2>Welcome Back</h2>
        <form id="loginForm" onsubmit="return handleLogin(event)">
          <table class="form-table">
            <tr><td><label for="login-email">Email *</label></td><td><input id="login-email" type="email" required></td></tr>
            <tr><td><label for="login-password">Password *</label></td><td><input id="login-password" type="password" minlength="6" required></td></tr>
          </table>
          <div class="form-buttons"><button type="submit" class="btn">Log In</button></div>
        </form>

        <div id="login-success" class="success-msg"><p>Logged in — redirecting...</p></div>
      </div>
    </article>
  </main>

  <footer class="site-footer"><div class="footer-links"><a href="index.html">Home</a><a href="about.html">About</a><a href="offers.html">Offers</a><a href="contact.html">Contact</a><a href="feedback.html">Feedback</a></div><p>&copy; Group_5 | Last updated: 27 May 2026</p></footer>
</div>

<script>
function handleLogin(e){
  e.preventDefault();
  document.getElementById('loginForm').style.display='none';
  document.getElementById('login-success').style.display='block';
  setTimeout(()=>location.href='index.html',1500);
  return false;
}
</script>
</body></html>
